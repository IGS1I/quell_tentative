<div class="keyboard-wrapper" [class.open]="visible()">
  <button
    type="button"
    class="keyboard-toggle"
    (mousedown)="$event.preventDefault()"
    (click)="toggleKeyboard()"
    [attr.aria-label]="visible() ? 'Hide keyboard' : 'Show keyboard'"
  >
    @if (visible()) { ⌨ Hide } @else { ⌨ Show }
  </button>

  <div class="keyboard-panel" [class.hidden]="!visible()">
    <div #keyboardContainer class="simple-keyboard"></div>
  </div>
</div>
