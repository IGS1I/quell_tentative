<a class="work-card" [class.now]="isNow()" [routerLink]="isNow() ? ['/task-selector', group().id] : ['/task-browser', group().id]">
  <span class="time">{{ group().startClockTime }} – {{ group().endClockTime }}</span>
  <strong>{{ group().groupName }}</strong>
  @if (group().groupDescription) {
    <p>{{ group().groupDescription }}</p>
  }
  @if (isNow()) {
    <span class="badge">Now</span>
  }
</a>
