<main class="start">
  <nav class="top">
    <a routerLink="/planner" class="icon-link" aria-label="Planner">Planner</a>
    <a routerLink="/settings" class="icon-link" aria-label="Settings">Settings</a>
  </nav>

  <app-clock />

  <section class="blocks" aria-label="Today's work blocks">
    @for (block of blocks(); track block.id) {
      <app-work [group]="block" [nowMinutes]="nowMinutes()" />
    } @empty {
      <div class="empty">
        <p>No more work blocks today.</p>
        <a class="button" routerLink="/create/work">Plan a work block</a>
      </div>
    }
  </section>

  @if (alarm.ringing()) {
    <div class="alarm-bar">
      <span>Alarm ringing</span>
      <button type="button" class="stop-alarm" (click)="alarm.stop()">Stop alarm</button>
    </div>
  }

  <nav class="bottom">
    <a routerLink="/create/work" class="icon-link">+ Work block</a>
  </nav>
</main>
